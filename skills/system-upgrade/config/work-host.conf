# skill/config/work-host.conf — work-host (display name "work-host"; work, npm)
# `hostname` on this box returns work-host; "work-host" is the operator's friendly
# alias used in NTFY_TOPIC and Slack but not by load_config.

HOSTNAME_EXPECTED="work-host"
DISPLAY_NAME="work"
ROLE="work"
EMBARGO_HOURS=96

TAILSCALE_SHARE_PATH="/home/openclaw/tailscale-shared"
TAILSCALE_SHARE_NAME="openclaw"

HOSTING_PROVIDER="Hostinger"
HOSTING_NOTE="hpanel.hostinger.com — log in, find this VPS, trigger snapshot manually"

OPENCLAW_INSTALL_KIND="npm"
OPENCLAW_NPM_PACKAGE="openclaw"
OPENCLAW_DOCKER_COMPOSE=""
OPENCLAW_DOCKER_PROJECT=""
OPENCLAW_DOCKER_GATEWAY_CONTAINER=""
OPENCLAW_DOCKER_IMAGE=""

QUIESCE_SERVICES_USER=("openclaw-gateway" "litellm" "openclaw-outlook-dashboard" "openclaw-pm-dashboard" "openclaw-sales-prospector-dashboard")
QUIESCE_CONTAINERS=()

NTFY_TOPIC="work-host-system-update"
SLACK_CHANNEL="YOUR_SLACK_CHANNEL_ID"   # #work-alerts

RUN_CONNECTOR_TESTS=0

REQUIRE_CANARY_PASS=1
CANARY_HOST="canary-host"
CANARY_SHARE_PATH="/home/openclaw/shared"   # canary host's tailscale share, accessed manually or via tailscale
