# skill/config/canary-host.conf — canary-host (personal/canary, Docker)
# Sourced by lib/common.sh on this host. All keys are simple bash assignments.

HOSTNAME_EXPECTED="canary-host"
ROLE="personal-canary"
EMBARGO_HOURS=72

TAILSCALE_SHARE_PATH="/home/openclaw/shared"
TAILSCALE_SHARE_NAME="shared"

HOSTING_PROVIDER="Hostinger"
HOSTING_NOTE="hpanel.hostinger.com — log in, find this VPS, trigger snapshot manually"

OPENCLAW_INSTALL_KIND="docker"
OPENCLAW_NPM_PACKAGE=""
OPENCLAW_DOCKER_COMPOSE="/root/openclaw/docker-compose.yml"   # requires sudo to read
OPENCLAW_DOCKER_PROJECT="openclaw"
OPENCLAW_DOCKER_GATEWAY_CONTAINER="openclaw-openclaw-gateway-1"
OPENCLAW_DOCKER_IMAGE="openclaw:local"

# Quiesce list applies during the Hostinger snapshot window only.
QUIESCE_SERVICES_USER=()
QUIESCE_CONTAINERS=("hermes-orchestrator-canary-host")

NTFY_TOPIC="canary-host-system-update"
SLACK_CHANNEL="YOUR_SLACK_CHANNEL_ID"   # #canary-alerts

RUN_CONNECTOR_TESTS=0
REQUIRE_CANARY_PASS=0          # canary host has no upstream canary requirement
